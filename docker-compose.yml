version: "3.9"
services:
  db:
    image: mysql:8
    volumes:
      - woocommerce-db-data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress

  wordpress:
    depends_on:
      - db
    image: wordpress:6.4
    volumes:
      - wordpress-data:/var/www/html
      - .:/var/www/html/wp-content/plugins/miguel
      - ./run/apache/authorization.conf:/etc/apache2/conf-enabled/authorization.conf:ro
      - ./run/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    ports:
      - "8000:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1

volumes:
  woocommerce-db-data:
    external: true
    name: miguel-woocommerce_woocommerce-db-data
  wordpress-data:
    external: true
    name: miguel-woocommerce_wordpress-data
