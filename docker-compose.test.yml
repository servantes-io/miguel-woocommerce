services:
  woocommerce_test_db:
    image: mysql:${MYSQL_VERSION:?MYSQL_VERSION is not set (see .test-versions)}
    environment:
      MYSQL_ROOT_PASSWORD: woocommerce_test_password
      MYSQL_DATABASE: woocommerce_tests
    tmpfs:
      - /var/lib/mysql

  phpunit:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        PHP_VERSION: ${PHP_VERSION:?PHP_VERSION is not set (see .test-versions)}
    # Tagged by the PHP version, so a change of it builds a new image.
    image: miguel-woocommerce-phpunit:php${PHP_VERSION:?PHP_VERSION is not set (see .test-versions)}
    depends_on:
      - woocommerce_test_db
    volumes:
      - .:/project
      - woocommerce_cache:/project/woocommerce
      - wp_tests_cache:/tmp/wordpress-tests-lib
      - wp_core_cache:/tmp/wordpress
    environment:
      WC_VERSION: ${WC_VERSION:?WC_VERSION is not set (see .test-versions)}
      WP_VERSION: ${WP_VERSION:?WP_VERSION is not set (see .test-versions)}
    entrypoint: /project/bin/docker-test-entrypoint.sh

# The installs are cached in named volumes that the entrypoint fills only when
# they are empty, so each is named by the version it holds: a version bump in
# .test-versions gets a fresh volume and installs that version instead of
# running on the old one. Volumes of an older version stay until removed
# (`docker volume ls`, `docker volume rm`). The versions are digits and dots.
volumes:
  woocommerce_cache:
    name: miguel-woocommerce-wc${WC_VERSION:?WC_VERSION is not set (see .test-versions)}
  wp_tests_cache:
    name: miguel-woocommerce-wp${WP_VERSION:?WP_VERSION is not set (see .test-versions)}-tests-lib
  wp_core_cache:
    name: miguel-woocommerce-wp${WP_VERSION:?WP_VERSION is not set (see .test-versions)}-core
